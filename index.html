<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园信息中心（迷你版）</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#home">校园信息中心</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="#home">首页</a>
        <a class="nav-link" href="#rooms">自习室</a>
        <a class="nav-link" href="#stats">使用统计</a>
        <a class="nav-link" href="three-d/scene.html">校园三维</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="home" class="mb-4">
      <h1 class="h3">校园公共信息与数据展示中心（迷你版）</h1>
      <p class="text-muted">课堂作业八,数据来源：课程统一数据集</p>
      <div class="row g-3" id="summary-cards">
        <div class="col-6 col-md-3">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h6">自习室总数</h2>
              <p class="card-text fs-4 text-muted">—</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h6">当前开放</h2>
              <p class="card-text fs-4 text-muted">—</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h6">总座位数</h2>
              <p class="card-text fs-4 text-muted">—</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="card">
            <div class="card-body">
              <h2 class="card-title h6">空余座位</h2>
              <p class="card-text fs-4 text-muted">—</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="rooms" class="mb-4">
      <h2 class="h5">自习室查询</h2>
      <p class="text-muted">占位</p>
    </section>

    <section id="stats" class="mb-4">
      <h2 class="h5">使用统计（各自习室空余座位）</h2>
      <p class="text-muted">占位</p>
    </section>
  </main>

  <footer class="text-center text-muted py-4">
    软件开发综合实践,课堂作业八,数据来源：课程统一数据集
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
</body>
</html>
