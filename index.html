<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园信息中心（迷你版）</title>
  <link rel="stylesheet" href="libs/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">校园信息中心</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="#home">首页</a>
        <a class="nav-link" href="#rooms">自习室</a>
        <a class="nav-link" href="#stats">使用统计</a>
        <a class="nav-link" href="three-d/scene.html">校园三维</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section id="home" class="mb-4">
      <h2 class="h5">首页概览</h2>
      <p class="text-muted">课堂作业八,数据来源：课程统一数据集</p>
      <div class="row g-3" id="summary-cards"></div>
    </section>

    <section id="rooms" class="mb-4">
      <h2 class="h5">自习室查询</h2>
      <div class="row g-2 mb-3">
        <div class="col-auto">
          <label for="floor-filter" class="form-label">楼层</label>
          <select id="floor-filter" class="form-select">
            <option value="all">全部</option>
            <option value="1">1层</option>
            <option value="2">2层</option>
            <option value="3">3层</option>
            <option value="4">4层</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="status-filter" class="form-label">状态</label>
          <select id="status-filter" class="form-select">
            <option value="all">全部</option>
            <option value="开放">开放</option>
            <option value="闭馆">闭馆</option>
            <option value="维修">维修</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="name-search" class="form-label">名称</label>
          <input id="name-search" class="form-control" type="text" placeholder="例如:图书馆">
        </div>
      </div>
      <ul id="room-list" class="list-group"></ul>
    </section>

    <section id="stats" class="mb-4">
      <h2 class="h5">使用统计（各自习室空余座位）</h2>
      <p id="status" class="alert alert-warning" style="display:none"></p>
      <div class="row g-3">
        <div class="col-md-6">
          <div id="usage-chart" class="chart-box"></div>
        </div>
        <div class="col-md-6">
          <div id="rate-chart" class="chart-box"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="container text-muted small mt-4 mb-4">
    软件开发综合实践 · 课堂作业八自主实践：整合练习成果
  </footer>

  <script src="libs/echarts.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
